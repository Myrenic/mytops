# Build the bouwstraat image inside the cluster, and install the result.
#
# Why in-cluster: nixpkgs' make-disk-image installs GRUB by booting a small VM
# (pkgs.vmTools.runInLinuxVM), so the derivation requires the `kvm` system
# feature. A workstation without /dev/kvm cannot build the qcow2 at all - it
# fails with "Reason: missing system features / Required features: {kvm}" only
# after the whole system closure has been built. The cluster nodes run KubeVirt,
# so they do have /dev/kvm.
#
# Why it also installs: the disk has to end up on the mytops-images volume either
# way, and doing it here keeps the artifact inside the build that produced it -
# no second job, no shared store, no window where "built" and "installed" are
# different revisions.
#
# The store is the container's own writable layer, not a volume. That is not an
# optimisation: a node hostPath produced a malformed db.sqlite, a Longhorn volume
# produced a hash mismatch importing a substituted path and then an invalid store
# path, and the ephemeral layer completed a full build on the first attempt. The
# cost is a fresh download each time (~10 minutes); the alternative kept being a
# store that lies. See docs/pitfalls.md.
#
# Before running: scale the image store down, because it mounts the same RWO
# volume this copies into.
#   kubectl -n services scale deploy/mytops-images --replicas=0
#
# Prerequisites (documented in docs/bouwstraat.md):
#   kubectl -n services create secret docker-registry forgejo-registry \
#     --docker-server=forge.tuntelder.com --docker-username=<user> \
#     --docker-password=<token>      # only needed when PUSH_REGISTRY=1
apiVersion: batch/v1
kind: Job
metadata:
  name: bouwstraat-build
  namespace: services
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bouwstraat
        app.kubernetes.io/component: build
    spec:
      restartPolicy: Never
      # Any node has /dev/kvm; pin the one that carries the workspace node pin in
      # webui.yaml, so the image and the VMs that boot it live in one place.
      nodeSelector:
        kubernetes.io/hostname: talos-45w-c87
      containers:
        - name: build
          image: docker.io/nixos/nix:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux

              # kvm is not in nix's default system-features, and the disk-image
              # step needs it; sandbox=false because a pod has no user namespace
              # for the nix sandbox, and the VM the image build boots is already
              # the isolation that matters here.
              export NIX_CONFIG='experimental-features = nix-command flakes
              system-features = benchmark big-parallel nixos-test kvm
              sandbox = false'

              # Only skopeo: the nixos/nix image already provides git and a CA
              # bundle in its profile, and `nix profile install git` fails with a
              # file conflict against that git-minimal before anything is built.
              nix profile install nixpkgs#skopeo

              # skopeo refuses to run without a container signature policy, and
              # an image build has nothing to verify against. Registry TLS is
              # unaffected; this only says "do not check signatures".
              mkdir -p /etc/containers
              printf '%s\n' '{"default":[{"type":"insecureAcceptAnything"}]}' \
                > /etc/containers/policy.json

              git clone --quiet https://github.com/Myrenic/mytops /work/mytops
              cd /work/mytops
              git checkout --quiet "$REV"
              cd bouwstraat

              nix build --no-link --print-out-paths .#packages.x86_64-linux.qcow2 | tee /work/qcow2.path
              nix build --no-link --print-out-paths .#packages.x86_64-linux.ociImage | tee /work/oci.path

              # ---- install the disk into the image store -------------------
              mkdir -p /images
              cp "$(cat /work/qcow2.path)/nixos.qcow2" /images/disk.qcow2
              # nginx runs as uid 101 and must be able to read it.
              chmod 0644 /images/disk.qcow2
              chmod 0755 /images
              sync

              echo "installed-bytes: $(stat -c %s /images/disk.qcow2)"
              # The checksum is taken from the copy on the volume, not from the
              # build output: what the catalog pins has to be what the importer
              # reads.
              sha256sum /images/disk.qcow2 | tee /images/disk.qcow2.sha256
              echo "GOLDEN-DISK-SHA256 $(cut -d' ' -f1 /images/disk.qcow2.sha256)"
              echo "GOLDEN-DISK-REV $REV"
              echo "BOUWSTRAAT-READY"

              # ---- optional registry push ----------------------------------
              # Off by default: the forge sits behind Cloudflare, which caps
              # request bodies, so a multi-GB blob cannot be uploaded through it
              # (413). Disk mode needs no registry - the disk is served from the
              # cluster's own image store instead.
              if [ "$PUSH_REGISTRY" = "1" ]; then
                skopeo copy --authfile /auth/.dockerconfigjson \
                  "docker-archive:$(cat /work/oci.path)" \
                  "docker://$REGISTRY/$IMAGE:rev-$SHORT"
                skopeo inspect --authfile /auth/.dockerconfigjson --format '{{.Digest}}' \
                  "docker://$REGISTRY/$IMAGE:rev-$SHORT" | tee /work/digest
                echo "BOUWSTRAAT-IMAGE $REGISTRY/$IMAGE@$(cat /work/digest)"
              fi
          env:
            - name: REV
              value: "6934543fdf15e65d4751480d40ef0026a688b975"
            - name: SHORT
              value: "6934543fdf15"
            - name: REGISTRY
              value: "forge.tuntelder.com"
            - name: IMAGE
              value: "mtuntelder/mytops-desktop-nixos"
            - name: PUSH_REGISTRY
              value: "0"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
          securityContext:
            # The disk-image step boots a VM through /dev/kvm, which needs both.
            privileged: true
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            - name: images
              mountPath: /images
            - name: registry-auth
              mountPath: /auth
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: images
          persistentVolumeClaim:
            claimName: mytops-images
        - name: registry-auth
          secret:
            secretName: forgejo-registry
        - name: work
          emptyDir:
            sizeLimit: 8Gi
