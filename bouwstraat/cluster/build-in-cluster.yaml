# Build the bouwstraat image inside the cluster.
#
# Why this exists: nixpkgs' make-disk-image installs GRUB by booting a small VM
# (pkgs.vmTools.runInLinuxVM), so the derivation requires the `kvm` system
# feature. A workstation without /dev/kvm therefore cannot build the qcow2 at
# all - it fails with "Reason: missing system features / Required features:
# {kvm}" only after the whole system closure has been built. The cluster nodes
# run KubeVirt, so they do have /dev/kvm, and the registry the image is pushed to
# is one hop away: build where both are true.
#
# This is applied by hand, not by Flux: it is a one-shot build, not a desired
# state. `scripts/bouwstraat.sh build` remains the path for anyone with a local
# KVM host.
#
# Prerequisites (documented in docs/bouwstraat.md):
#   kubectl -n services create secret docker-registry forgejo-registry \
#     --docker-server=forge.tuntelder.com --docker-username=<user> \
#     --docker-password=<token>
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bouwstraat-nix
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # The built closure for one desktop image, with room for the next.
      storage: 30Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bouwstraat-build
  namespace: services
spec:
  backoffLimit: 0
  # Keep the finished pod's logs around long enough to read the digest, then
  # clean up after itself.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bouwstraat
        app.kubernetes.io/component: build
    spec:
      restartPolicy: Never
      # Any node has /dev/kvm; pinned so a rebuild lands where the last one did
      # and the on-node store below is reused instead of re-fetched.
      nodeSelector:
        kubernetes.io/hostname: talos-45w-c87
      initContainers:
        # A nix store cannot be mounted empty over /nix: the nix binary itself
        # lives there, so an empty volume makes the image unusable. Seed the
        # cache from the image once, then let it grow across builds.
        - name: seed-store
          image: docker.io/nixos/nix:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -x /cache/var/nix/profiles/default/bin/nix ]; then
                echo "store cache already seeded"
              else
                echo "seeding store cache from the image"
                cp -a /nix/. /cache/
              fi
          volumeMounts:
            - name: cache
              mountPath: /cache
      containers:
        - name: build
          image: docker.io/nixos/nix:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eux

              # kvm is not in nix's default system-features, and the disk-image
              # step needs it; sandbox=false because a pod has no user namespace
              # for the nix sandbox, and the VM the image build boots is already
              # the isolation that matters here.
              export NIX_CONFIG='experimental-features = nix-command flakes
              system-features = benchmark big-parallel nixos-test kvm
              sandbox = false'

              # Only skopeo: the nixos/nix image already provides git and a CA
              # bundle in its profile, and `nix profile install git` fails with a
              # file conflict against that git-minimal before anything is built.
              # A store on replicated storage does not verify itself, and this
              # one has now produced both classic symptoms of trusting it: a
              # malformed db.sqlite on a node hostPath, and a hash mismatch
              # importing a substituted path from a Longhorn volume. Verify and
              # repair first, so the cache is an optimisation rather than a
              # hazard; anything corrupt is re-substituted from the binary cache.
              nix-store --verify --check-contents --repair || true

              nix profile install nixpkgs#skopeo

              # skopeo refuses to run without a container signature policy, and
              # an image build has nothing to verify against. This says so
              # explicitly instead of failing with "no policy.json file found"
              # after the disk has been built. Registry TLS is unaffected.
              mkdir -p /etc/containers
              printf '%s\n' '{"default":[{"type":"insecureAcceptAnything"}]}' \
                > /etc/containers/policy.json

              git clone --quiet https://github.com/Myrenic/mytops /work/mytops
              cd /work/mytops
              git checkout --quiet "$REV"
              cd bouwstraat

              nix build --no-link --print-out-paths .#packages.x86_64-linux.qcow2 | tee /work/qcow2.path
              nix build --no-link --print-out-paths .#packages.x86_64-linux.ociImage | tee /work/oci.path

              # The checksum of the disk as built. install-golden recomputes it
              # from the copy it installs, and that is the one the catalog pins -
              # this is here so a build log on its own says what it produced.
              sha256sum "$(cat /work/qcow2.path)/nixos.qcow2" | tee /work/qcow2.sha256
              echo "BOUWSTRAAT-DISK $(cat /work/qcow2.path)/nixos.qcow2"
              echo "BOUWSTRAAT-DISK-SHA256 $(cut -d' ' -f1 /work/qcow2.sha256)"

              # Registry push is off by default: the forge sits behind
              # Cloudflare, which caps request bodies, so a multi-GB blob cannot
              # be uploaded through it (413). Disk mode needs no registry - the
              # disk is served from the cluster's own image store instead.
              if [ "$PUSH_REGISTRY" = "1" ]; then
                skopeo copy --authfile /auth/.dockerconfigjson \
                  "docker-archive:$(cat /work/oci.path)" \
                  "docker://$REGISTRY/$IMAGE:rev-$SHORT"
                skopeo inspect --authfile /auth/.dockerconfigjson --format '{{.Digest}}' \
                  "docker://$REGISTRY/$IMAGE:rev-$SHORT" | tee /work/digest
                echo "BOUWSTRAAT-IMAGE $REGISTRY/$IMAGE@$(cat /work/digest)"
              fi
          env:
            - name: REV
              value: "7b3e6ed6ceb673e148adbeda58adb9bbff885df3"
            - name: SHORT
              value: "7b3e6ed6ceb6"
            - name: REGISTRY
              value: "forge.tuntelder.com"
            - name: IMAGE
              value: "mtuntelder/mytops-desktop-nixos"
            # Off: see the note at the push step. Set to 1 only from somewhere
            # that can reach a registry without a body-size cap.
            - name: PUSH_REGISTRY
              value: "0"
          resources:
            requests:
              cpu: "4"
              memory: 8Gi
          securityContext:
            # The disk-image step boots a VM through /dev/kvm, which needs both.
            privileged: true
          volumeMounts:
            - name: cache
              mountPath: /nix
            - name: kvm
              mountPath: /dev/kvm
            - name: registry-auth
              mountPath: /auth
              readOnly: true
            - name: work
              mountPath: /work
      volumes:
        # A nix store on the node's ephemeral /var did not survive contact: the
        # second build failed with "database disk image is malformed" in
        # /nix/var/nix/db/db.sqlite, after the first one had paid the full
        # download. A Longhorn volume is replicated, outlives the node's
        # ephemeral storage, and still keeps ~20 GiB of closure out of the way of
        # everything else.
        - name: cache
          persistentVolumeClaim:
            claimName: bouwstraat-nix
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: registry-auth
          secret:
            secretName: forgejo-registry
        - name: work
          emptyDir:
            sizeLimit: 8Gi
