# Populate the in-cluster workspace image store with a disk the bouwstraat built.
#
# The build job leaves its store in /var/mytops-bouwstraat-nix on the node it ran
# on, so this reads the qcow2 straight out of that cache - no download, no
# registry, and nothing crossing the public edge. It prints the sha256 of the
# file it installed; that is the value the catalog pins.
#
# Applied by hand, like the build job: it is a one-shot copy, not a desired state.
#
# The mytops-images Deployment mounts the same RWO volume, so scale it down for
# the install and back up afterwards (docs/bouwstraat.md).
apiVersion: batch/v1
kind: Job
metadata:
  name: bouwstraat-install-golden
  namespace: services
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bouwstraat
        app.kubernetes.io/component: install-golden
    spec:
      restartPolicy: Never
      # The cache is node-local and only exists where the build ran.
      nodeSelector:
        kubernetes.io/hostname: talos-45w-c87
      containers:
        - name: install
          image: docker.io/library/alpine:3.21
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu

              src=$(ls /cache/store/*-nixos-disk-image/nixos.qcow2 2>/dev/null | head -1 || true)
              if [ -z "$src" ]; then
                echo "no built disk in the cache on this node - run the build job first" >&2
                exit 1
              fi
              echo "source: $src"
              echo "source-bytes: $(stat -c %s "$src")"

              mkdir -p /images
              cp "$src" /images/disk.qcow2
              # nginx runs as uid 101 and must be able to read it.
              chmod 0644 /images/disk.qcow2
              chmod 0755 /images
              sync

              echo "installed-bytes: $(stat -c %s /images/disk.qcow2)"
              # The checksum is printed from the copy on the volume, not from the
              # source: what the catalog pins has to be what the importer reads.
              sha256sum /images/disk.qcow2 | tee /images/disk.qcow2.sha256

              echo "GOLDEN-DISK-SHA256 $(cut -d' ' -f1 /images/disk.qcow2.sha256)"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: false
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: cache
              mountPath: /cache
              readOnly: true
            - name: images
              mountPath: /images
      volumes:
        - name: cache
          hostPath:
            path: /var/mytops-bouwstraat-nix
            type: Directory
        - name: images
          persistentVolumeClaim:
            claimName: mytops-images
