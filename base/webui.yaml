apiVersion: apps/v1
kind: Deployment
metadata:
  name: mytops-webui
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mytops-webui
  template:
    metadata:
      labels:
        app: mytops-webui
    spec:
      serviceAccountName: mytops-control
      containers:
        - name: webui
          image: nginx:1.31-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: webui
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Workplace API: validates requests server-side, enforces group ACL,
        # builds manifests, and provisions workspace resources via the
        # kubectl-proxy sidecar.  The browser never touches the K8s API.
        - name: workplace-api
          image: docker.io/library/node:22-alpine
          command: ["node", "/etc/mytops-api/server.mjs"]
          ports:
            - name: workplace
              containerPort: 3001
          env:
            - name: KUBE_API
              value: "http://127.0.0.1:8001"
            - name: WORKSPACE_NAMESPACE
              value: "services"
            - name: CATALOG_PATH
              value: "/etc/mytops/catalog.json"
            # Workspace URLs are built from this. Without it the API derives
            # the domain from the request's Host header, which is right through
            # Traefik but nonsense for anything reaching the pod directly (a
            # port-forward or the pod IP yields "0.0.1").
            - name: BASE_DOMAIN
              value: "${SECRET_DOMAIN_0}"
            # Where the Longhorn CRs live (the namespace its Flux Kustomization
            # targets, and where the matching Role in nebula is created). The
            # API deletes the volume behind a destroyed VM workspace; pointing
            # it anywhere else leaves a 10Gi ghost per destroyed VM.
            - name: LONGHORN_NAMESPACE
              value: "storage"
            # Streaming desktops are frame-latency sensitive; talos-sz9-1vs
            # carries more control-plane churn (etcd, apiserver) and panicked
            # to load 10.6/8 vs 0.9 on talos-45w-c87. Move workspace pods off
            # it while it settles.
            - name: WORKSPACE_NODE
              value: "talos-45w-c87"
          # TURN_HOST/TURN_PORT/TURN_PROTOCOL/TURN_SHARED_SECRET for coturn.
          # The API maps them onto the workspaces' SELKIES_TURN_* variables,
          # which is how the browser gets relay candidates - without them a VM
          # desktop (masquerade'd pod IP, unreachable from the browser)
          # negotiates media it can never send.
          envFrom:
            - secretRef:
                name: mytops-turn
          volumeMounts:
            - name: api-catalog
              mountPath: /etc/mytops
              readOnly: true
            - name: api-code
              mountPath: /etc/mytops-api
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: workplace
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Proxies the Kubernetes API (RBAC-scoped to the mytops-control
        # ServiceAccount) so the workplace-api can provision workspace pods.
        - name: kubectl-proxy
          image: alpine/k8s:1.37.0
          # Loopback only. The workplace-api container shares this pod's network
          # namespace, so it still reaches 127.0.0.1:8001, but no other pod in
          # the cluster can. --disable-filter is not needed for plain API calls
          # and must stay off: it disables the proxy's request filter.
          command: ["kubectl", "proxy", "--port=8001", "--address=127.0.0.1"]
          ports:
            - name: api
              containerPort: 8001
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: webui
          configMap:
            name: mytops-webui
        - name: nginx-conf
          configMap:
            name: mytops-nginx
        - name: api-catalog
          configMap:
            name: mytops-api-catalog
        - name: api-code
          configMap:
            name: mytops-workplace-api
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mytops-webui
  namespace: services
spec:
  selector:
    app: mytops-webui
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: workplace
      port: 3001
      targetPort: workplace