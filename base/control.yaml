# Scoped ServiceAccount for the webui's kubectl-proxy sidecar. Allows the SPA
# to create/read/roll/delete per-user workspace pods (Deployments + Services
# in services, IngressRoutes in network) and to patch Deployments for the
# "Restart" button.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mytops-control
  namespace: services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mytops-control
  namespace: services
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    # watch: the idle culler deletes Services with kubectl, which watches the
    # object to confirm the delete; without it the culler's log fills up with
    # "cannot watch resource" errors that look like permission failures.
    verbs: ["get", "list", "watch", "create", "delete"]
  # The per-user home volume, one per user, plus the keeper deployment that
  # holds it attached so a VM guest can mount its NFS export. Deliberately no
  # "delete": nothing in the API is allowed to throw a user's data away.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create"]
  # Finding the per-user home agent pod that serves the file API: the keeper
  # pods have no Service (they are reachable by the API alone), so the API
  # resolves them by label and talks to the pod IP.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mytops-control
  namespace: services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mytops-control
subjects:
  - kind: ServiceAccount
    name: mytops-control
    namespace: services
# NOTE: the network-namespace Role/RoleBinding for ingressroutes lives in
# kubernetes/apps/network/ingressroutes/control.yaml (this Kustomization has
# targetNamespace=services, which would force every resource into services).