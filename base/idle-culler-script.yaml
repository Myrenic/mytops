# The culler script, stored base64 so the Flux postBuild envsubst cannot reach
# it: inline text in ConfigMap data had its shell variable references replaced
# with empty strings, which is why it is encoded at all. Kubernetes decodes
# binaryData when it writes the mounted file, so the container runs the script
# straight from the mount.
#
# Consequence to remember when editing: the payload is opaque to grep and to
# rename sweeps. The label keys inside it must match the labels api/server.mjs
# puts on a workspace Deployment (mytops-owner, mytops-lifecycle) - a rename
# that skips this file leaves a culler that silently skips every workspace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mytops-idle-culler-script
  namespace: services
  labels:
    app.kubernetes.io/name: mytops
    app.kubernetes.io/component: idle-culler
binaryData:
  cull.sh: 
